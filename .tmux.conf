# Prefix: backtick
set-option -g prefix `
unbind C-b
bind-key ` send-prefix

set-option -g prefix2 C-Space
bind-key C-Space send-prefix -2

# Mouse support
set -g mouse on

# allow-passthrough is supposed to make notifications (OSC52) work. Also yazi image previews. 
# Neither works as far as I can tell - I have never seen a mac notification from a claude-code 
# in tmux on remote machine. It does, however, seem to work for making copy/paste play nicely 
# with the mac clipboard, which is a life-saver!
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Options recommended for claude code
# set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Terminal
set -g default-terminal tmux-256color
set -g default-shell /bin/zsh
set -sg escape-time 0
set -g history-limit 30000
set -g focus-events on
set -g repeat-time 1000

# Start numbering at 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Window titles
set -g set-titles on
set -g set-titles-string '#S:#I.#P #W'

# Status bar: just session name on the left, nothing on the right
set -g status-style "reverse"
set -g status-justify centre
set -g status-left " [#S] "
set -g status-right ""

# Active window in status bar
setw -g window-status-current-style "fg=white"
setw -g window-status-style "dim"

# Active pane gets a bright border, inactive panes get a dim one
set -g pane-active-border-style "fg=green"
set -g pane-border-style "fg=default"
# set -g pane-border-lines "double"

# Dim the background of inactive panes so the active one stands out.
# Both styles need explicit colors — bg=default leaks through window-style.
set -g window-style "bg=colour234"
set -g window-active-style "bg=colour236"

# Clock
setw -g clock-mode-colour colour32
setw -g clock-mode-style 24

# Copy mode with system clipboard
setw -g mode-keys vi
set -g set-clipboard on
bind p paste-buffer

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Show pane numbers (prefix + q) for longer
set -g display-panes-time 3000

# last-window moved from prefix+l to prefix+\;
bind \; last-window

# New detached session with name prompt
bind-key S command-prompt -p "New session name:" "new-session -d -s '%%'"

# Splits
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Toggle two side-by-side panes between one-third/two-thirds widths.
# Each press makes the active pane wide if it is narrow, and narrow if it is wide.
bind-key -r W if-shell -F '#{==:#{window_panes},2}' {
  if-shell -F '#{==:#{pane_height},#{window_height}}' {
    if-shell -F '#{e|<|:#{pane_width},#{e|/|:#{window_width},2}}' {
      resize-pane -x 66%
    } {
      resize-pane -x 33%
    }
  } {
    display-message 'Width toggle requires two side-by-side panes'
  }
} {
  display-message 'Width toggle requires exactly two panes'
}

# Next/previous window with repeat
bind-key -r n next-window
bind-key -r N previous-window

# Reorder windows (-d keeps focus on the moved window)
bind-key -r S-Left swap-window -d -t -1
bind-key -r S-Right swap-window -d -t +1

# Show a popup
bind-key P display-popup -EE -w 80% -h 80% -d "#{pane_current_path}"

# Reload tmux conf
bind-key R source-file ~/.tmux.conf

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# extrakto
set -g @plugin 'laktak/extrakto'
set -g @extrakto_split_direction 'v'
set -g @extrakto_split_size '20'
set -g @extrakto_clip_mode 'tmux_osc52'

# Keep this at the very end
run '~/.tmux/plugins/tpm/tpm'

