# Prefix: backtick
set-option -g prefix `
unbind C-b
bind-key ` send-prefix

set-option -g prefix2 C-Space
bind-key C-Space send-prefix -2

# Mouse support
set -g mouse on

# Terminal
set -g default-terminal tmux-256color
set -g default-shell /bin/zsh
set -sg escape-time 0
set -g history-limit 30000
set -g focus-events on

# Start numbering at 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Window titles
set -g set-titles on
set -g set-titles-string '#S:#I.#P #W'

# Status bar: just session name on the left, nothing on the right
set -g status-style "reverse"
set -g status-justify centre
set -g status-left " [#S] "
set -g status-right ""

# Active window in status bar
setw -g window-status-current-style "fg=white,bg=blue,bold"
setw -g window-status-style "dim"

# Active pane gets a bright border, inactive panes get a dim one
set -g pane-active-border-style "fg=green"
set -g pane-border-style "fg=default"
# set -g pane-border-lines "double"

# Dim the background of inactive panes so the active one stands out.
# Both styles need explicit colors — bg=default leaks through window-style.
set -g window-style "bg=colour234"
set -g window-active-style "bg=colour236"

# Clock
setw -g clock-mode-colour colour32
setw -g clock-mode-style 24

# Copy mode with system clipboard
setw -g mode-keys vi
set -g set-clipboard on
bind p paste-buffer

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Show pane numbers (prefix + q) for longer
# set -g show-panes-time 2000

# last-window moved from prefix+l to prefix+\;
bind \; last-window

# New detached session with name prompt
bind-key S command-prompt -p "New session name:" "new-session -d -s '%%'"

# Splits
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Next/previous window with repeat
bind-key -r n next-window
bind-key -r N previous-window

# Reorder windows (-d keeps focus on the moved window)
bind-key -r S-Left swap-window -d -t -1
bind-key -r S-Right swap-window -d -t +1

# Show a popup
bind-key P display-popup -EE -w 80% -h 80% -d "#{pane_current_path}"

