[[mgr.prepend_keymap]]
on   = "!"
for  = "unix"
run  = 'shell "$SHELL" --block'
desc = "Open $SHELL here"

[[mgr.prepend_keymap]]
on   = [ "g", "l" ]
run  = "shell lgit --block"
desc = "run lazygit"

[[mgr.prepend_keymap]]
on   = [ "g", "f" ]
run  = 'shell "lgit --filter %h" --block'
desc = "run lazygit"

[[input.prepend_keymap]]
on   = "<Esc>"
run  = "close"
desc = "Cancel input"

[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on = [ "g", "r" ]
run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"'

[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin wide-preview"
desc = "Toggle wide preview pane (1:1:6 vs 1:3:4)"

[[mgr.prepend_keymap]]
on   = [ "g", "s", "c" ]
run  = 'shell -- pane=$(tmux split-window -h -c "$PWD" -P -F "#{pane_id}"); tmux send-keys -t "$pane" "claude" Enter'
desc = "gs: Open Claude in tmux split (current dir)"

[[mgr.prepend_keymap]]
on   = [ "g", "s", "p" ]
run  = 'shell -- tmux send-keys -t "{last}" a BSpace "$(printf "%s " $@)"; tmux last-pane'
desc = "gs: Send paths to last pane and focus it"

[[mgr.prepend_keymap]]
on   = [ "g", "s", "P" ]
run  = 'shell -- tmux send-keys -t "{last}" a BSpace "$(printf "%s " $@)"'
desc = "gs: Send paths to last pane (stay in Yazi)"

[[mgr.prepend_keymap]]
on   = [ "g", "s", "s" ]
run  = 'shell -- tmux split-window -h -c "$PWD"'
desc = "gs: Open teminal in tmux split (current dir)"

[[mgr.prepend_keymap]]
on   = [ "t", "p" ]
run  = 'shell -- tmux display-popup -EE -w 80% -h 80% -d "$PWD"'
desc = "gs: Open teminal in tmux split (current dir)"

